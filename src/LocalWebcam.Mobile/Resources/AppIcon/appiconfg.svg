<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="55%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>
  </defs>

  <!-- Same artwork as appicon.svg minus the background square, recentered
       for Android's adaptive-icon safe zone - the mask crops a transparent
       foreground layer independently of the background layer, so this
       needs to stand on its own without the framing the full icon has.
       No drop-shadow filter here - MAUI's SVG-to-PNG resizer doesn't
       support SVG filters and silently drops the whole group rather than
       just ignoring the filter (confirmed by inspecting the generated
       mipmap PNGs: the phone body was missing entirely). -->
  <g transform="translate(-79,0)">
    <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M 660 300 A 180 180 0 0 1 830 470" stroke-width="26" opacity="0.55"/>
      <path d="M 700 340 A 120 120 0 0 1 830 470" stroke-width="26" opacity="0.75"/>
      <path d="M 740 380 A 60 60 0 0 1 830 470" stroke-width="26" opacity="0.95"/>
    </g>

    <g>
      <rect x="352" y="220" width="320" height="584" rx="56" fill="url(#phoneBody)"/>
      <rect x="352" y="220" width="320" height="584" rx="56" fill="none" stroke="#334155" stroke-width="4"/>
      <rect x="472" y="256" width="80" height="10" rx="5" fill="#475569"/>
    </g>

    <circle cx="512" cy="520" r="150" fill="#020617"/>
    <circle cx="512" cy="520" r="132" fill="url(#lensGlass)"/>
    <circle cx="512" cy="520" r="132" fill="none" stroke="#0C4A6E" stroke-width="8"/>
    <circle cx="472" cy="480" r="34" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="512" cy="520" r="46" fill="#020617" opacity="0.85"/>

    <rect x="472" y="748" width="80" height="12" rx="6" fill="#475569"/>
  </g>
</svg>
